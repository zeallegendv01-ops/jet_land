services:
  - type: web
    name: jetland-api
    rootDir: server
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health

  - type: web
    name: jetland-web
    rootDir: web
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: JETLAND_API_URL
        value: https://jet-land-2.onrender.com
      - key: NEXT_PUBLIC_JETLAND_API_URL
        value: https://jet-land-2.onrender.com
      - key: JETLAND_API_HOSTPORT
        fromService:
          type: web
          name: jetland-api
          property: hostport
